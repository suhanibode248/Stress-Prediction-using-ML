services:
  - type: web
    name: neuroscan
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: neuroscan-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
